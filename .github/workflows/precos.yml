name: Preços dos combustíveis
on:
  schedule:
    - cron: "17 5,11,17 * * *"   # 3 vezes por dia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarregar preços da DGEG
        run: python3 scripts/precos.py /tmp/precos.json
      # os preços vão para um ramo à parte ("dados"), substituído de cada vez,
      # para não encher o histórico do ramo principal
      - name: Publicar no ramo dados
        run: |
          cd /tmp && rm -rf dados && mkdir dados && cd dados
          git init -q -b dados
          cp /tmp/precos.json .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add precos.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Preços atualizados"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados
